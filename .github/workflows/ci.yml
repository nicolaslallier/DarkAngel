name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with COVERAGE_MIN in the Makefile.
  COVERAGE_MIN: "80"

jobs:
  backend-unit:
    name: Backend unit + regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv and install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m ruff check .

      - name: Test
        # --cov-config scopes the gate to what a service-less run can reach:
        # .coveragerc.ci omits the repository and the backfill script, which
        # only a real PostgreSQL exercises (backend-integration gates those).
        run: |
          .venv/bin/python -m pytest -m "unit or regression" \
            --junitxml=reports/junit.xml \
            --cov=app --cov-config=.coveragerc.ci \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under="$COVERAGE_MIN"

      - name: Summary
        if: always()
        run: |
          echo "### Backend unit + regression" >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/python -m coverage report --format=markdown \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-reports
          path: |
            backend/reports/junit.xml
            backend/coverage.xml
          if-no-files-found: warn

  backend-integration:
    name: Backend integration (real MinIO + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # A service container works here, unlike MinIO: the postgres image needs
      # no custom command, so Actions can start it directly.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: darkangel
          POSTGRES_PASSWORD: darkangel
          POSTGRES_DB: darkangel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darkangel -d darkangel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # `CI` makes an unreachable MinIO or Postgres fail the job, not skip it.
      CI: "true"
      DARKANGEL_S3_ENDPOINT: localhost:9000
      DARKANGEL_S3_ACCESS_KEY: minioadmin
      DARKANGEL_S3_SECRET_KEY: minioadmin
      DARKANGEL_S3_SECURE: "false"
      DARKANGEL_DATABASE_URL: postgresql+psycopg://darkangel:darkangel@localhost:5432/darkangel
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv and install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Start MinIO
        # A plain container, not a service container: those cannot pass the
        # `server /data` command the MinIO image needs.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO never became ready" >&2
          docker logs minio >&2
          exit 1

      - name: Test
        run: .venv/bin/python -m pytest -m integration --junitxml=reports/junit.xml

      - name: Summary
        if: always()
        run: |
          echo "### Backend integration" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran against MinIO at $DARKANGEL_S3_ENDPOINT and Postgres at localhost:5432." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-reports
          path: backend/reports/junit.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (vitest + vue-tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: |
          npm run test:coverage -- \
            --reporter=default --reporter=junit \
            --outputFile.junit=reports/junit.xml

      # `npm run build` is `vue-tsc -b && vite build`, so this type-checks too.
      - name: Build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "vitest + vue-tsc + vite build." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            frontend/reports/junit.xml
            frontend/coverage/lcov.info
          if-no-files-found: warn
