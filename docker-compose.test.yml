# SeaweedFS and Postgres, for the integration suite. Nothing else in this project
# needs a local service, so this file stays deliberately small.
#
#   make services-test-up && make test-integration && make services-test-down
#
# The credentials are defaults and only ever exist on a developer's machine and
# on the CI runner: the real deployment's keys come from Portainer.
services:
  s3:
    # Same release and digest as the Infra stack's `s3` service, so the suite
    # proves the store production runs. Root credentials come from the AWS_*
    # variables; without them SeaweedFS serves anonymously.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: server -ip.bind=0.0.0.0 -s3 -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin-secret
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Postgres 16, because the schema uses `UNIQUE NULLS NOT DISTINCT` (PG 15+).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: darkangel
      POSTGRES_PASSWORD: darkangel
      POSTGRES_DB: darkangel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkangel -d darkangel"]
      interval: 2s
      timeout: 3s
      retries: 20
