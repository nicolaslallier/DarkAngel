# MinIO and Postgres, for the integration suite. Nothing else in this project
# needs a local service, so this file stays deliberately small.
#
#   make services-test-up && make test-integration && make services-test-down
#
# The credentials are defaults and only ever exist on a developer's machine and
# on the CI runner: the real deployment's keys come from Portainer.
services:
  minio:
    # quay.io and Docker Hub stopped serving MinIO publicly (2026-09); Chainguard's
    # build is pinned by digest (MinIO RELEASE.2026-09-22T19-25-18Z).
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Postgres 16, because the schema uses `UNIQUE NULLS NOT DISTINCT` (PG 15+).
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: darkangel
      POSTGRES_PASSWORD: darkangel
      POSTGRES_DB: darkangel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkangel -d darkangel"]
      interval: 2s
      timeout: 3s
      retries: 20
