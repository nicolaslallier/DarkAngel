[project]
name = "darkangel"
version = "1.4.0"
description = "DarkAngel API service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "neo4j>=6.3.0",
    "pyside6>=6.7.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
     "pytest>=8.0.0",
     "httpx>=0.27.0",
     "pytest-qt>=4.4.0",
]

[project.scripts]
darkangel = "darkangel.main:main"
darkangel-gui = "darkangel.gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkangel"]

[tool.uv]
package = true

[tool.mypy]
# `darkangel` is a src-layout namespace package: `mypy_path` points mypy at the
# source root and `explicit_package_bases` stops mypy from also resolving the
# package from the current working directory (no `__init__.py` by design).
python_version = "3.14"
mypy_path = ["src"]
explicit_package_bases = true

[tool.pytest.ini_options]
# The `tests` package exposes shared fixtures to its siblings (`capabilities_fakes`);
# adding the project root to `sys.path` lets `from tests.capabilities_fakes import ...`
# resolve under pytest's rootdir-based collection.
pythonpath = ["."]

[tool.ruff.lint.isort]
# Treat `tests` as first-party so the shared fixture module sorts cleanly.
known-first-party = ["tests"]
