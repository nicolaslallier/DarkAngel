# DarkAngel -- https://darkangel.infra.famillelallier.net
#
# This file belongs to the Infra stack (github.com/nicolaslallier/Infra): copy
# it to nginx/conf.d/darkangel.conf there and `make up`. It is kept here so the
# vhost is versioned next to the stack it fronts.
#
# DarkAngel runs as its own Portainer stack (deploy/portainer-stack.yml), whose
# SPA container joins infra-net as `darkangel-web`. That container is itself
# nginx: it serves the built SPA and proxies /api to the backend over the
# stack's private network (frontend/nginx.conf), so the API is same-origin and
# nothing here needs to know about it. The backend never joins infra-net and
# publishes no port.
#
# The hostname is covered by the `*.infra.famillelallier.net` cert and DNS
# wildcard, so no gen-certs.sh SAN and no dns-provision.sh zone are needed.
#
# The resolver + $upstream pattern resolves the upstream per request, so a
# stopped DarkAngel stack does not keep nginx itself from starting.

server {
    listen 443 ssl;
    server_name darkangel.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://darkangel-web:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
