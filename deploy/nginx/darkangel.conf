# DarkAngel -- https://darkangel.infra.famillelallier.net
#
# This file belongs to the Infra stack (github.com/nicolaslallier/Infra): copy
# it to nginx/conf.d/darkangel.conf there and `make up`. It is kept here so the
# vhost is versioned next to the stack it fronts.
#
# This NGINX is the only web server in front of DarkAngel: it serves the SPA's
# files itself and proxies the API. The DarkAngel stack
# (deploy/portainer-stack.yml) runs no nginx of its own -- its web-assets
# container copies the built SPA into the shared `darkangel-web` volume and
# exits, and darkangel-api is the FastAPI container on infra-net.
#
# That volume is the one thing this vhost needs from the Infra compose. On the
# nginx service:
#
#     volumes:
#       - darkangel-web:/srv/darkangel:ro
#
# and at the top level, next to pgdata and friends:
#
#     volumes:
#       darkangel-web:
#         external: true
#
# External because two stacks share it: `docker volume create darkangel-web`
# once on the host, exactly like infra-net.
#
# The hostname is covered by the `*.infra.famillelallier.net` cert and DNS
# wildcard, so no gen-certs.sh SAN and no dns-provision.sh zone are needed.
#
# Unlike ea.conf and jarvis.conf, /api/ has no `rewrite`: DarkAngel's router is
# mounted at /api itself, so the prefix is passed through rather than stripped.
# The resolver + $upstream pattern still resolves the API per request, so a
# stopped DarkAngel stack does not keep nginx itself from starting.

server {
    listen 443 ssl;
    server_name darkangel.infra.famillelallier.net;

    include /etc/nginx/snippets/ssl.conf;

    resolver 127.0.0.11 valid=10s;

    # The built SPA, as published by the stack's web-assets container. It
    # swaps current/ into place, so this path is never a half-written copy;
    # before the stack's first deploy it does not exist and requests 404.
    root /srv/darkangel/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # Home-file uploads (Files page) come through here; nginx's default
        # 1m would 413 anything bigger than a small photo.
        client_max_body_size 100m;
        set $upstream http://darkangel-api:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Hashed Vite assets are immutable. An add_header here drops the one
    # nginx.conf sets at http level, so X-Trace-Id is repeated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Trace-Id $otel_trace_id always;
    }

    # History-mode routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
