# DarkAngel stack for Portainer.
#
# Deploy this as a Portainer stack (Stacks -> Add stack). Point it at this file
# via the "Repository" build method, or paste it in with the Web editor.
#
# Stack environment variables (Portainer -> Stack -> Environment variables):
#   IMAGE_OWNER    GHCR namespace, lowercase   (default: nicolaslallier)
#   IMAGE_TAG      image tag to run            (default: latest)
#   S3_SECRET_KEY     secret of S3 identity darkangel (Infra: make s3-provision)
#   POSTGRES_PASSWORD password of the darkangel database role (see `make postgres`)
#   PORTAINER_INSTANCES  JSON list of Portainer instances the collector polls
#                     (name, url, api_key); see docs/dashboard.md
#   BACKUP_S3_SECRET_KEY secret of the read-only S3 identity portainer-backups-ro
#
# The GitHub Actions deploy workflow pushes new images and then calls this
# stack's webhook, which re-pulls the tag and recreates the services.
#
# The stack runs on the Mac Studio (Portainer environment set by the
# PORTAINER_ENDPOINT_ID repository variable), away from the Infra stack on the
# homelab. So it reaches nothing over infra-net: the Infra services it needs
# are published on the homelab's LAN address (INFRA_HOST) by the Infra NGINX --
# Postgres on 5432, SeaweedFS on 8333, and Keycloak's JWKS plus Prometheus'
# read API on 8480 (Infra: nginx/conf.d/darkangel-lan.conf).
#
# `web` serves the SPA that web-assets copies into the darkangel-web volume and
# proxies /api/ to darkangel-api, on port 8088 of the Mac Studio. TLS and the
# public name stay on the homelab: the Infra NGINX vhost for
# https://darkangel.infra.famillelallier.net proxies everything to it.

services:
  darkangel-api:
    image: ghcr.io/${IMAGE_OWNER:-nicolaslallier}/darkangel-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DARKANGEL_DEBUG: "false"
      # The SPA and the API answer on the same origin through the Infra NGINX,
      # so the browser never makes a cross-origin call. Add origins here if the
      # API grows callers of its own.
      DARKANGEL_CORS_ORIGINS: '[]'
      # Tokens are still checked against the public issuer
      # (https://keycloak.famillelallier.net/realms/ea); only the signing keys
      # are read from Keycloak directly over infra-net, so the container needs
      # no copy of the Infra CA to trust the public hostname.
      # Plain HTTP on the LAN, so no copy of the Infra CA is needed either.
      DARKANGEL_AUTH_JWKS_URL: http://${INFRA_HOST:-192.168.2.10}:8480/realms/ea/protocol/openid-connect/certs
      # Home files go to the Infra SeaweedFS (`s3:8333` on infra-net), bucket
      # darkangel-files as identity darkangel -- both made by Infra's
      # `make s3-provision app=darkangel bucket=darkangel-files versioned=1`.
      # S3_SECRET_KEY is a stack variable `make up` copies from .portainer.env.
      DARKANGEL_S3_ENDPOINT: ${INFRA_HOST:-192.168.2.10}:8333
      DARKANGEL_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Metadata lives in the Infra PostgreSQL (`postgres:5432` on infra-net),
      # database darkangel as role darkangel -- both made by `make postgres`.
      # POSTGRES_PASSWORD is a stack variable `make up` copies from
      # .portainer.env, the same way S3_SECRET_KEY arrives.
      DARKANGEL_DATABASE_URL: postgresql+psycopg://darkangel:${POSTGRES_PASSWORD:-}@${INFRA_HOST:-192.168.2.10}:5432/darkangel
      DARKANGEL_PROMETHEUS_URL: http://${INFRA_HOST:-192.168.2.10}:8480
      # Post-upload AI summaries (backend/app/summary.py) by the Ollama on the
      # Mac at 192.168.2.35 (Ollama.app, listening on *:11434). Not a secret,
      # so no stack variable; empty turns summaries off, and an unreachable
      # server (Mac asleep, IP changed) only leaves them blank.
      DARKANGEL_OLLAMA_URL: http://192.168.2.35:11434
      DARKANGEL_OLLAMA_MODEL: gemma4:26b-a4b-it-qat
      # Chat (docs/chat.md): LiteLLM and the Exo cluster on the Mac. Empty
      # LLM_URL turns chat off (503). LLM_API_KEY is a stack variable `make up`
      # copies from .portainer.env, the same way S3_SECRET_KEY arrives.
      DARKANGEL_LLM_URL: http://192.168.2.35:4000
      DARKANGEL_EXO_URL: http://192.168.2.35:52415
      DARKANGEL_LLM_API_KEY: ${LLM_API_KEY:-}
    expose:
      - "8000"

  # Polls the Portainer instances and the portainer-backups bucket every five
  # minutes and writes what it saw to PostgreSQL; the dashboard reads that. It
  # is the only service that holds Portainer API keys (Docker-root tokens).
  # No migration here: darkangel-api runs `alembic upgrade head`. On the very
  # first deploy a pass can fail for want of the tables -- it logs and retries.
  darkangel-collector:
    image: ghcr.io/${IMAGE_OWNER:-nicolaslallier}/darkangel-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "app.collector"]
    # The image's HEALTHCHECK probes port 8000, which this process never opens.
    healthcheck:
      disable: true
    environment:
      DARKANGEL_DATABASE_URL: postgresql+psycopg://darkangel:${POSTGRES_PASSWORD:-}@${INFRA_HOST:-192.168.2.10}:5432/darkangel
      DARKANGEL_PORTAINER_INSTANCES: ${PORTAINER_INSTANCES:-[]}
      DARKANGEL_BACKUP_S3_ENDPOINT: ${INFRA_HOST:-192.168.2.10}:8333
      DARKANGEL_BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}

  web-assets:
    image: ghcr.io/${IMAGE_OWNER:-nicolaslallier}/darkangel-frontend:${IMAGE_TAG:-latest}
    # One-shot: it copies the built SPA into darkangel-web and exits, so a
    # redeploy republishes the new build and the container stays down after.
    # Exited is the healthy steady state here -- `make ps` shows it as such.
    restart: "no"
    # It talks to nothing; the volume is its only contact with the rest.
    network_mode: none
    volumes:
      - darkangel-web:/srv/darkangel

  # The stack's only web server: the SPA from darkangel-web, /api/ to
  # darkangel-api. Plain HTTP on the LAN; the homelab's Infra NGINX terminates
  # TLS for the public name and proxies here. The config is inline because a
  # Portainer git stack cannot bind-mount files from the repository.
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - darkangel-api
    ports:
      - "8088:80"
    volumes:
      - darkangel-web:/srv/darkangel:ro
    configs:
      - source: web-conf
        target: /etc/nginx/conf.d/default.conf

configs:
  web-conf:
    content: |
      server {
        listen 80;
        # Docker's embedded DNS, resolved per request so nginx starts even
        # while darkangel-api is still coming up.
        resolver 127.0.0.11 valid=10s;

        # web-assets swaps current/ into place, so this is never half-written.
        root /srv/darkangel/current;
        index index.html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;

        location /api/ {
          # Uploads up to the API's max_upload_bytes (5 GiB), streamed.
          client_max_body_size 5g;
          proxy_request_buffering off;
          proxy_read_timeout 1h;
          proxy_send_timeout 1h;
          set $$upstream http://darkangel-api:8000;
          proxy_pass $$upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          # The homelab NGINX in front sets these; pass them through.
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          proxy_set_header X-Real-IP $$http_x_real_ip;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        # Hashed Vite assets are immutable.
        location /assets/ {
          add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # History-mode routing: unknown paths fall through to the SPA shell.
        location / {
          try_files $$uri $$uri/ /index.html;
        }
      }

volumes:
  # Filled by web-assets, read by web. Owned by this stack.
  darkangel-web:
