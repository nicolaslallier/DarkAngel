# DarkAngel stack for Portainer.
#
# Deploy this as a Portainer stack (Stacks -> Add stack). Point it at this file
# via the "Repository" build method, or paste it in with the Web editor.
#
# Stack environment variables (Portainer -> Stack -> Environment variables):
#   IMAGE_OWNER    GHCR namespace, lowercase   (default: nicolaslallier)
#   IMAGE_TAG      image tag to run            (default: latest)
#
# The GitHub Actions deploy workflow pushes new images and then calls this
# stack's webhook, which re-pulls the tag and recreates the services.
#
# Nothing here publishes a host port: the Infra stack's NGINX is the only
# ingress (github.com/nicolaslallier/Infra). It reaches the SPA container by its
# infra-net name, `darkangel-web`, and serves it at
# https://darkangel.infra.famillelallier.net -- see deploy/nginx/darkangel.conf
# for the vhost to install there.

services:
  backend:
    image: ghcr.io/${IMAGE_OWNER:-nicolaslallier}/darkangel-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DARKANGEL_DEBUG: "false"
      # Same-origin through the SPA container's nginx proxy, so no cross-origin
      # callers by default. Add origins here if the API is called directly.
      DARKANGEL_CORS_ORIGINS: '[]'
    expose:
      - "8000"
    # The private stack network only: the API is reachable through darkangel-web
    # and nothing else. `backend` is the name frontend/nginx.conf proxies to.
    networks:
      - darkangel

  darkangel-web:
    image: ghcr.io/${IMAGE_OWNER:-nicolaslallier}/darkangel-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    # Named for infra-net, which every app on this host shares: a plain
    # `frontend` alias would collide with the next stack's.
    networks:
      - darkangel
      - infra-net

networks:
  darkangel:
    driver: bridge
  # Created by the Infra stack; `make up-local` creates it if it is missing.
  infra-net:
    external: true
